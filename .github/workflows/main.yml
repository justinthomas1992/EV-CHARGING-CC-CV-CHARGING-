name: MATLAB EV CC-CV Charging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Look for MATLAB/Simulink files
        id: detect
        run: |
          if find . -path ./.git -prune -o \( -name '*.m' -o -name '*.slx' -o -name '*.mdl' \) -print | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MATLAB or Simulink files in the repository yet, so the MATLAB steps are skipped."
          fi

      - name: Set up MATLAB
        if: steps.detect.outputs.found == 'true'
        uses: matlab-actions/setup-matlab@v2.2.0
        with:
          products: Simulink Simscape Simscape_Electrical

      - name: Run MATLAB tests
        if: steps.detect.outputs.found == 'true'
        uses: matlab-actions/run-tests@v2
